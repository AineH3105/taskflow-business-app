<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="page-header">
    <h1>TaskFlow</h1>
   <p>Update an Existing Team Task</p>
</header>

<main class="container">

    <section class="dashboard-card form-card">

        <div class="section-heading">
            <h2>Edit Task</h2>

            <a class="secondary-button" href="{{ url_for('home') }}">
                Back to Dashboard
            </a>
        </div>

        <form method="POST" class="task-form">

            <div class="form-group">
                <label for="title">Task title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ task.title }}"
                    required
                    maxlength="100"
                >
            </div>

            <div class="form-group">
                <label for="assigned_to">Assigned to</label>

                <input
                    type="text"
                    id="assigned_to"
                    name="assigned_to"
                    value="{{ task.assigned_to }}"
                    required
                    maxlength="60"
                >
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority" required>
                    <option value="Low"
                        {% if task.priority == "Low" %}selected{% endif %}>
                        Low
                    </option>

                    <option value="Medium"
                        {% if task.priority == "Medium" %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="High"
                        {% if task.priority == "High" %}selected{% endif %}>
                        High
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" name="status" required>
                    <option value="To Do"
                        {% if task.status == "To Do" %}selected{% endif %}>
                        To Do
                    </option>

                    <option value="In Progress"
                        {% if task.status == "In Progress" %}selected{% endif %}>
                        In Progress
                    </option>

                    <option value="Completed"
                        {% if task.status == "Completed" %}selected{% endif %}>
                        Completed
                    </option>
                </select>
            </div>

            <button class="primary-button" type="submit">
                Save Changes
            </button>

        </form>

    </section>

</main>

</body>
</html>
